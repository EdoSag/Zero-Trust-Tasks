name: zero_trust_tasks
description: End-to-end encrypted tasks and reminders, part of the Zero-Trust apps.
publish_to: none
version: 0.4.0+11
environment:
  sdk: ^3.8.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see the Zero-Trust-Core README).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  # Shared account, keys, vault lock, sync, settings and look for every
  # Zero-Trust app.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # Core Dev: Hebrew + language setting (PR #21) and Z24 shared spaces
      # (PR #22), which shared lists use. Switch to the release tag once
      # one is pushed.
      ref: 5c8476ea033a30c097b2ac1d8803fe8ed7921110
  # Location reminders (T11), watched by the phone itself: no Google Play
  # services, the location never leaves the phone (Core PR #26). Switch to
  # the release tag once one is pushed.
  zt_places:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_places
      ref: 6f397423bdc8d1a5313da870cc89677e40e93277
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^11.2.0
  supabase_flutter: ^2.9.0
  file_picker: ^12.0.0
  path_provider: ^2.1.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.0
  url_launcher: ^6.3.0
  table_calendar: ^3.1.0
  fl_chart: ^0.69.0
  uuid: ^4.5.2
  # Home-screen widget (Android).
  home_widget: ^0.9.3
  # Reads Google Takeout .zip files.
  archive: ^4.0.9
  # Shared lists: invite links as a QR code, scanning one, and sending one.
  share_plus: ^13.3.1
  qr_flutter: ^4.1.0
  qr_code_scanner_plus: ">=2.1.2 <2.2.0"
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
