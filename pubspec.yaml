name: zero_trust_tasks
description: End-to-end encrypted tasks and reminders, part of the Zero-Trust apps.
publish_to: none
version: 0.5.2+15
environment:
  sdk: ^3.8.0

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see the Zero-Trust-Core README).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  # Shared account, keys, vault lock, sync, settings and look for every
  # Zero-Trust app.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      # Core Dev with the shared spaces trust chain fix (Core PR #35) and
      # invite links per app (Core PR #37). Every app that shares must be on
      # this commit or later: older ones cannot read the new member records.
      # Switch to the release tag once one is pushed.
      ref: 52f53dae085fb247ec1b8fa34b95f3231dc0421b
  # Location reminders (T11), watched by the phone itself: no Google Play
  # services, the location never leaves the phone.
  zt_places:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_places
      ref: 52f53dae085fb247ec1b8fa34b95f3231dc0421b
  # The shared sharing screens (people, invite, join, compare codes), the
  # same in every Zero-Trust app.
  zt_sharing_ui:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_sharing_ui
      ref: 52f53dae085fb247ec1b8fa34b95f3231dc0421b
  flutter_riverpod: ^3.5.0
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^11.2.0
  supabase_flutter: ^2.9.0
  file_picker: ^12.0.0
  path_provider: ^2.1.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.0
  url_launcher: ^6.3.0
  table_calendar: ^3.1.0
  fl_chart: ^0.69.0
  uuid: ^4.5.2
  # Home-screen widget (Android).
  home_widget: ^0.9.3
  # Reads Google Takeout .zip files.
  archive: ^4.0.9
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  # Release checks every Zero-Trust app runs in CI (keys, sync, sign-in, app
  # setup, database). Independent of zero_trust_core, so it may be newer.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b43fcd045722bc364ef2eaa739db181f9dac144f
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
